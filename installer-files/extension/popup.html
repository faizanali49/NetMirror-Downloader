<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NetMirror Pro Downloader</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="top">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--blue);filter:drop-shadow(0 0 4px var(--blue-glow))">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      NetMirror Pro Downloader
    </div>
    <div class="top-actions">
      <span class="pill" id="server-pill">server ?</span>
      <span class="pill" id="tab-pill">tab ?</span>
      <button class="btn" id="refresh-btn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
        Refresh
      </button>
      <button class="btn red" id="clear-btn">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Clear
      </button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="capture">Capture</div>
    <div class="tab" data-view="jobs">Downloads</div>
    <div class="tab" data-view="network">Network</div>
  </div>

  <div class="body">
<div class="credit">
  <div class="credit-text">
    Developed by
    <a href="https://github.com/faizanali49" target="_blank" rel="noopener">
      Faizan Ali
    </a>
  </div>

  <a
    href="https://github.com/faizanali49"
    target="_blank"
    rel="noopener"
    class="credit-avatar-link"
  >
    <img
      src="https://github.com/faizanali49.png?size=50"
      alt="Faizan Ali"
      class="credit-avatar"
    />
  </a>
</div>
    
    <div class="panel-view active" id="view-capture">
      <div class="section">
        <div class="section-title">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
          </svg>
          Current Video Target
        </div>
        
        <div class="meta">
          <div class="thumb" id="meta-thumb">thumb</div>
          <div style="overflow:hidden; display:flex; flex-direction:column; gap:var(--spacing-xs);">
            <input type="text" id="meta-title" class="editable-title" placeholder="Enter custom video title..." value="No video metadata yet">
            <div class="sub" id="meta-sub">Play a video to capture stream URLs.</div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <polyline points="12 12 17 7 22 12"></polyline>
          </svg>
          Video Resolution
        </div>
        <div class="grid" id="video-grid"></div>
      </div>

      <div class="section">
        <div class="section-title">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
          Generated Audio Tracks
        </div>
        <div class="grid" id="audio-grid"></div>
      </div>
    </div>

    <div class="panel-view" id="view-jobs">
      <div id="jobs-list"></div>
    </div>

    <div class="panel-view" id="view-network">
      <div id="network-list"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-main">
      <div class="selected-line" id="selection-text">Select one video stream and one generated audio track.</div>
      <button class="btn primary" id="download-btn" disabled>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
